[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "netbox-room-view"
version = "0.1.1"
description = "dcTrack-style floor plan and rack elevation view for NetBox comms rooms, with drag and drop"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
dependencies = []

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
include = ["netbox_room_view*"]

[tool.setuptools.package-data]
netbox_room_view = ["templates/netbox_room_view/*.html", "templates/netbox_room_view/inc/*"]
