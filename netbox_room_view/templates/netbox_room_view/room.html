{% extends 'generic/object.html' %}

{% block content %}
<style>{% include 'netbox_room_view/inc/roomview.css' %}</style>

<div id="rv-app" class="rv" data-api="{{ api_root }}" data-csrf="{{ csrf_token }}">
  <div class="card mb-3">
    <div class="card-body d-flex flex-wrap gap-3 align-items-center py-2">
      <div class="d-flex align-items-center gap-2">
        <label for="rv-color" class="text-muted small mb-0">Colour by</label>
        <select id="rv-color" class="form-select form-select-sm w-auto">
          <option value="space">Space used</option>
          <option value="power">Power used</option>
          <option value="role">Rack role</option>
          <option value="status">Rack status</option>
          <option value="tenant">Tenant</option>
        </select>
      </div>
      <div class="d-flex align-items-center gap-2">
        <input id="rv-search" type="search" class="form-control form-control-sm" style="width: 16rem"
               placeholder="Find rack, device, serial or asset tag" autocomplete="off">
        <span id="rv-search-count" class="text-muted small"></span>
      </div>
      <div id="rv-legend" class="d-flex flex-wrap gap-3 small"></div>
      <div class="ms-auto d-flex align-items-center gap-3">
        <div class="btn-group btn-group-sm" role="group" aria-label="Zoom">
          <button type="button" class="btn btn-outline-secondary" id="rv-zoom-out" title="Zoom out"><i class="mdi mdi-magnify-minus-outline"></i></button>
          <button type="button" class="btn btn-outline-secondary" id="rv-zoom-fit" title="Fit to width"><i class="mdi mdi-fit-to-screen-outline"></i></button>
          <button type="button" class="btn btn-outline-secondary" id="rv-zoom-in" title="Zoom in"><i class="mdi mdi-magnify-plus-outline"></i></button>
        </div>
        <div class="form-check form-switch mb-0" id="rv-edit-wrap">
          <input class="form-check-input" type="checkbox" role="switch" id="rv-edit">
          <label class="form-check-label" for="rv-edit">Edit mode</label>
        </div>
      </div>
    </div>
  </div>

  <div class="row g-3">
    <div class="col-12 col-xxl-8">
      <div class="card mb-3">
        <div class="card-header d-flex flex-wrap align-items-center gap-2">
          <h2 class="card-title mb-0"><i class="mdi mdi-floor-plan"></i> Floor plan</h2>
          <span id="rv-room-size" class="text-muted small"></span>
          <div class="btn-group btn-group-sm ms-2" role="group" aria-label="View">
            <button type="button" class="btn btn-outline-primary" id="rv-view-2d">2D</button>
            <button type="button" class="btn btn-outline-primary" id="rv-view-3d">3D</button>
          </div>
          <div class="btn-group btn-group-sm d-none" role="group" aria-label="3D camera" id="rv-3d-controls">
            <button type="button" class="btn btn-outline-secondary" id="rv-3d-left" title="Rotate left 45°"><i class="mdi mdi-rotate-left"></i></button>
            <button type="button" class="btn btn-outline-secondary" id="rv-3d-right" title="Rotate right 45°"><i class="mdi mdi-rotate-right"></i></button>
            <button type="button" class="btn btn-outline-secondary" id="rv-3d-top" title="Top-down view"><i class="mdi mdi-arrow-collapse-down"></i></button>
            <button type="button" class="btn btn-outline-secondary" id="rv-3d-reset" title="Reset view"><i class="mdi mdi-restore"></i></button>
            <button type="button" class="btn btn-outline-secondary" id="rv-3d-spin" title="Auto-rotate"><i class="mdi mdi-rotate-3d-variant"></i></button>
          </div>
          <form id="rv-size-form" class="ms-auto d-none align-items-center gap-1">
            <label class="small text-muted mb-0" for="rv-cols">Size</label>
            <input id="rv-cols" type="number" min="1" max="200" class="form-control form-control-sm" style="width: 4.5rem" aria-label="Columns">
            <span class="text-muted">&times;</span>
            <input id="rv-rows" type="number" min="1" max="200" class="form-control form-control-sm" style="width: 4.5rem" aria-label="Rows">
            <button type="submit" class="btn btn-sm btn-outline-primary">Resize</button>
          </form>
        </div>
        <div class="rv-floor-wrap" id="rv-floor-wrap">
          <svg id="rv-floor" role="img" aria-label="Floor plan"></svg>
          <canvas id="rv-floor3d" class="rv-floor3d d-none" role="img" aria-label="3D view of the room"></canvas>
        </div>
        <div class="card-footer small text-muted" id="rv-hint"></div>
      </div>

      <div class="card mb-3 d-none" id="rv-palette"></div>
      <div class="card mb-3 rv-tray" id="rv-tray" data-tray></div>
    </div>

    <div class="col-12 col-xxl-4">
      <div class="card rv-panel" id="rv-panel"></div>
    </div>
  </div>

  <div class="rv-tooltip" id="rv-tooltip" hidden></div>
  <div class="rv-toasts" id="rv-toasts" aria-live="polite"></div>
</div>

{{ payload|json_script:"rv-data" }}
<script>{% include 'netbox_room_view/inc/roomview3d.js' %}</script>
<script>{% include 'netbox_room_view/inc/roomview.js' %}</script>
{% endblock %}
